<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Pokemon</title>
</head>
<body>
    <h1>Editar Pokemon</h1>

    <form id="editForm">
        <label for="id">ID del Pokémon a editar:</label>
        <input type="number" id="id" placeholder="Ej: 2" required /><br><br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" /><br><br>

        <label for="tipo">Tipo:</label>
        <select id="tipo">
            <option value="">-- Selecciona un tipo --</option>
            <option value="Fuego">Fuego</option>
            <option value="Agua">Agua</option>
            <option value="Planta">Planta</option>
            <option value="Eléctrico">Eléctrico</option>
            <option value="Roca">Roca</option>
            <option value="Psíquico">Psíquico</option>
            <option value="Normal">Normal</option>
        </select><br><br>

        <label for="foto">Foto:</label>
        <input type="text" id="foto" placeholder="Ej: 3" /><br><br>

        <label for="precio">Precio:</label>
        <input type="number" step="0.01" id="precio" placeholder="Ej: 9.5" required /><br><br>

        <button type="submit">Editar Pokémon</button>
    </form>

    <h2>Respuesta</h2>
    <pre id="resultado"></pre>

    <script>
        document.getElementById('editForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const id = document.getElementById('id').value;
            const datos = {
                nombre: document.getElementById('nombre').value,
                tipo: document.getElementById('tipo').value,
                foto: document.getElementById('foto').value,
                precio: parseFloat(document.getElementById('precio').value)
            };

            const respuesta = await fetch('/pokemons/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const texto = await respuesta.text();
            document.getElementById('resultado').textContent =
                'Estado: ' + respuesta.status + '\n\n' + texto;
        });
    </script>
</body>
</html>
